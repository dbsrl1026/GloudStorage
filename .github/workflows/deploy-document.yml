name: Deploy service-document to Kubernetes

on:
  push:
    branches:
      - main
    paths:
      - 'service-document/**'
      - 'k8s/service-document/**'
      - 'k8s/service-document-deployment.yaml'

env:
  IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_PREFIX }}service-document

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: Grant execute permission for Gradle wrapper
      run: chmod +x ./service-document/gradlew

    - name: Build with Gradle
      run: |
        cd service-document
        ./gradlew build -x test

    - name: Build and Push Docker Image
      run: |
        docker build -t $IMAGE_NAME:latest ./service-document
        docker push $IMAGE_NAME:latest

    - name: Set up Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config

    - name: Create ConfigMap for application.properties
      run: |
        kubectl delete configmap service-document-config --ignore-not-found
        kubectl create configmap service-document-config \
          --from-literal=application.properties="${{ secrets.APP_PROPS_DOCUMENT }}"

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/service-document-deployment.yaml
        kubectl apply -f k8s/service-document/service.yaml
        kubectl apply -f k8s/service-document/hpa.yaml
