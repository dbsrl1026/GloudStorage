name: Deploy service-auth to Kubernetes

on:
  push:
    branches:
      - main
    paths:
      - 'service-auth/**'
      - 'k8s/service-auth/**'
      - 'k8s/service-auth-deployment.yaml'

env:
  IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_PREFIX }}service-auth

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for Gradle wrapper
      run: chmod +x ./service-auth/gradlew

    - name: Build with Gradle
      run: |
        cd service-auth
        ./gradlew build

    - name: Build and Push Docker Image
      run: |
        docker build -t $IMAGE_NAME:latest ./service-auth
        docker push $IMAGE_NAME:latest

    - name: Set up Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config

    - name: Create ConfigMap for application.properties
      run: |
        kubectl delete configmap service-auth-config --ignore-not-found
        kubectl create configmap service-auth-config \
          --from-literal=application.properties="${{ secrets.APP_PROPS_AUTH }}"

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/service-auth-deployment.yaml
        kubectl apply -f k8s/service-auth/service.yaml
        kubectl apply -f k8s/service-auth/hpa.yaml
