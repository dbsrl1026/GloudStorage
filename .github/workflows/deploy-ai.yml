name: Deploy service-ai to Kubernetes

on:
  push:
    branches:
      - main
    paths:
      - 'service-ai/**'
      - 'k8s/service-ai/**'
      - 'k8s/service-ai-deployment.yaml'

env:
  IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_PREFIX }}service-ai

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      run: |
        docker build -t $IMAGE_NAME:latest ./service-ai
        docker push $IMAGE_NAME:latest

    - name: Set up Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config

    - name: Create ConfigMap for .env
      run: |
        kubectl delete configmap service-ai-config --ignore-not-found
        kubectl create configmap service-ai-config \
          --from-literal=.env="${{ secrets.ENV_AI }}"

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/service-ai-deployment.yaml
        kubectl apply -f k8s/service-ai/service.yaml
        kubectl apply -f k8s/service-ai/hpa.yaml
